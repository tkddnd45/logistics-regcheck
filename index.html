// 배포 버전 표시 — 새 파일을 올릴 때마다 이 값을 바꾸면, 화면과 브라우저 탭

const APP_VERSION = "v2.9 (2026-09-14)";

/* ------------------------------------------------------------------ */
/*  API 설정                                                           */
/* ------------------------------------------------------------------ */
const VWORLD_KEY = "D36CAB8C-CF18-43B8-861D-9A4751FC00FC";
const VWORLD_DOMAIN = window.location.origin;
const LAW_OC = "qazwsxedcrfv753"; // 법제처 open.law.go.kr 인증값
const ZONE_LAYERS = [
  { id: "LT_C_UQ111", label: "도시지역" },
  { id: "LT_C_UQ112", label: "관리지역" },
  { id: "LT_C_UQ113", label: "농림지역" },
  { id: "LT_C_UQ114", label: "자연환경보전지역" },
];
const ZONE_NAMES = [
  "계획관리지역", "생산관리지역", "보전관리지역", "자연녹지지역", "생산녹지지역", "보전녹지지역",
  "전용공업지역", "일반공업지역", "준공업지역", "농림지역", "자연환경보전지역",
  "제1종전용주거지역", "제2종전용주거지역", "제1종일반주거지역", "제2종일반주거지역", "제3종일반주거지역",
  "준주거지역", "중심상업지역", "일반상업지역", "근린상업지역", "유통상업지역",
];
function matchZoneName(text) { return text ? (ZONE_NAMES.find((n) => text.includes(n)) || null) : null; }
// 용도지역별 건폐율·용적률 상한 (국토의 계획 및 이용에 관한 법률 시행령 제84조·제85조, 2026.7.1 시행 기준)
const ZONE_LAW_LIMITS = {
  "계획관리지역": { bcr: 40, farMin: 50, farMax: 100 },
  "생산관리지역": { bcr: 20, farMin: 50, farMax: 80 },
  "보전관리지역": { bcr: 20, farMin: 50, farMax: 80 },
  "자연녹지지역": { bcr: 20, farMin: 50, farMax: 100 },
  "전용공업지역": { bcr: 70, farMin: 150, farMax: 300 },
  "일반공업지역": { bcr: 70, farMin: null, farMax: 350 },
  "준공업지역": { bcr: 70, farMin: null, farMax: 400 },
};
function zoneWarehouseLawText(zoneName) {
  if (zoneName === "계획관리지역") {
    return {
      text: "계획관리지역은 원칙적으로 창고시설 건축이 불가능하며, 지자체 조례가 허용 목록에서 제외해야 건축이 가능합니다.",
      article: "국토의 계획 및 이용에 관한 법률 시행령 제71조제1항제19호·별표20 제1호 (2026.7.1 시행 기준)",
    };
  }
  return {
    text: "이 용도지역의 창고시설 허용 여부는 국토계획법 시행령 별표(용도지역안에서의 건축제한)를 별도로 확인해야 합니다.",
    article: "국토의 계획 및 이용에 관한 법률 시행령 제71조제1항제19호 관련 별표",
  };
}
function fmt(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return Number(n).toLocaleString("ko-KR", { maximumFractionDigits: digits });
}
// 지번 주소에서 "OO시" 또는 "OO군" 토큰을 찾아 시군명을 추정 (조례 검색용)
function extractCityName(address) {
  if (!address) return null;
  const tokens = address.trim().split(/\s+/);
  for (const t of tokens) {
    if (/[가-힣]+시$/.test(t) && !/(특별시|광역시|자치시)$/.test(t)) return t;
    if (/[가-힣]+군$/.test(t)) return t;
  }
  for (const t of tokens) {
    if (/(특별시|광역시|특별자치시|특별자치도)$/.test(t)) return t;
  }
  return null;
}

/* ------------------------------------------------------------------ */
/*  브이월드 JSONP 호출                                                */
/* ------------------------------------------------------------------ */
function vworldFetch(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "vworldCb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let timeoutId;
    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeoutId);
    }
    window[callbackName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("JSONP 요청 실패 (네트워크 또는 domain 등록 URL 불일치 가능성)")); };
    timeoutId = setTimeout(() => { cleanup(); reject(new Error("요청 시간 초과 (10초)")); }, 10000);
    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "callback=" + callbackName;
    document.head.appendChild(script);
  });
}
async function vworldGeocode(address) {
  const url = "https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326"
    + "&address=" + encodeURIComponent(address)
    + "&refine=true&simple=false&format=json&type=parcel"
    + "&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  return vworldFetch(url);
}
async function vworldData(layerId, extraParams) {
  let url = "https://api.vworld.kr/req/data?service=data&version=2.0&request=GetFeature&format=json&crs=epsg:4326"
    + "&size=5&page=1&data=" + layerId + "&geometry=false&attribute=true"
    + "&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  if (extraParams) url += extraParams;
  return vworldFetch(url);
}
async function vworldLandPrice(pnu) {
  // stdrYear를 지정하지 않으면 오래된 연도부터 반환되는 것으로 확인되어,
  // 여러 건(numOfRows)을 한 번에 받아 그중 가장 최신 연도를 골라 쓴다.
  const url = "https://api.vworld.kr/ned/data/getIndvdLandPriceAttr?pnu=" + encodeURIComponent(pnu)
    + "&format=json&numOfRows=50&pageNo=1&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  return vworldFetch(url);
}
function pickProp(p, candidates) {
  if (!p) return null;
  for (const c of candidates) { if (p[c] !== undefined && p[c] !== null && p[c] !== "") return p[c]; }
  return null;
}
function firstFeature(resp) {
  return resp && resp.response && resp.response.result && resp.response.result.featureCollection
    && resp.response.result.featureCollection.features && resp.response.result.featureCollection.features[0];
}

async function lookupViaVWorld(address) {
  const debug = {};
  const geo = await vworldGeocode(address);
  debug.step1_geocode = geo;
  const point = geo && geo.response && geo.response.result && geo.response.result.point;
  if (!point) return { success: false, reason: "주소를 좌표로 변환하지 못했습니다.", debug };
  const x = point.x, y = point.y;
  // 지오코딩 응답의 구조화된 주소에서 시·군·구 이름을 직접 가져온다
  // (사용자가 입력한 지번 텍스트를 다시 파싱하는 것보다 훨씬 정확함).
  const structure = geo.response.refined && geo.response.refined.structure;
  const cityName = structure ? (structure.level2 || structure.level1 || null) : null;

  const cadastral = await vworldData("LP_PA_CBND_BUBUN", "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
  debug.step2_cadastral = cadastral;
  const cprops = ((firstFeature(cadastral) || {}).properties) || {};
  const pnu = cprops.pnu || cprops.PNU || null;
  if (!pnu) return { success: false, reason: "좌표는 찾았지만 필지 정보를 확인하지 못했습니다.", debug };

  let jimok = null, areaVal = null;
  try {
    const landInfo = await vworldData("LT_C_LANDINFOBASEMAP", "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
    debug.step3_landinfobasemap = landInfo;
    const lprops = (firstFeature(landInfo) || {}).properties || null;
    jimok = pickProp(lprops, ["jimok_nm", "JIMOK_NM", "jimok", "lndcgr_nm", "jimokNm"]);
    areaVal = pickProp(lprops, ["parea", "PAREA", "area", "AREA", "lndpcl_ar"]);
  } catch (e) { debug.step3_error = String(e); }

  let zoneName = null;
  for (const layer of ZONE_LAYERS) {
    const r = await vworldData(layer.id, "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
    debug["step4_zone_" + layer.id] = r;
    const f = firstFeature(r);
    if (f) {
      const props = f.properties || {};
      zoneName = (props.uname && matchZoneName(props.uname)) ? props.uname : matchZoneName(JSON.stringify(props));
      break;
    }
  }
  return { success: true, pnu, jimok, areaVal, zoneName, cityName, debug };
}

/* ------------------------------------------------------------------ */
/*  법제처 자치법규 API                                                */
/* ------------------------------------------------------------------ */
async function lawSearchOrdin(query) {
  const url = "https://www.law.go.kr/DRF/lawSearch.do?OC=" + encodeURIComponent(LAW_OC)
    + "&target=ordin&type=JSON&display=20&query=" + encodeURIComponent(query);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function lawServiceOrdin(mst) {
  const url = "https://www.law.go.kr/DRF/lawService.do?OC=" + encodeURIComponent(LAW_OC)
    + "&target=ordin&type=JSON&MST=" + encodeURIComponent(mst);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
// 응답 JSON 구조가 불확실한 데다, 검색결과가 1건이면 배열이 아니라 단일
// 객체로 오는 경우가 있어(브이월드류 정부 API에서 흔함), 배열/단일객체 모두
// 재귀적으로 훑어서 해당 필드를 가진 객체를 직접 찾아낸다.
function deepFindByField(obj, fieldIncludes, matchFn, out) {
  if (!obj || typeof obj !== "object") return;
  if (Array.isArray(obj)) { obj.forEach((it) => deepFindByField(it, fieldIncludes, matchFn, out)); return; }
  const entry = Object.entries(obj).find(([k]) => fieldIncludes.some((f) => k.includes(f)));
  if (entry && matchFn(entry[1])) out.push(obj);
  Object.values(obj).forEach((v) => deepFindByField(v, fieldIncludes, matchFn, out));
}
function findOrdinCandidates(searchJson, keyword) {
  const out = [];
  deepFindByField(searchJson, ["자치법규명"], (v) => typeof v === "string" && v.includes(keyword), out);
  return out;
}
function findJoArray(serviceJson) {
  const out = [];
  deepFindByField(serviceJson, ["조내용", "조문내용"], () => true, out);
  return out;
}
function joText(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("조내용") || k.includes("조문내용"));
  return entry ? String(entry[1]) : "";
}
function joTitle(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("조제목"));
  return entry ? String(entry[1]) : "";
}
function mstOf(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("자치법규일련번호") || k === "MST");
  return entry ? String(entry[1]) : null;
}
function nameOf(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("자치법규명"));
  return entry ? String(entry[1]) : "";
}

async function fetchOrdinanceKeywordHits(cityName, keywords) {
  const debug = {};
  const query = `${cityName} 도시계획 조례`;
  const searchJson = await lawSearchOrdin(query);
  debug.search = searchJson;
  const candidates = findOrdinCandidates(searchJson, "도시계획 조례");
  if (candidates.length === 0) {
    return { found: false, reason: `"${query}" 검색 결과에서 도시계획 조례를 찾지 못했습니다.`, debug };
  }
  const mst = mstOf(candidates[0]);
  const ordinName = nameOf(candidates[0]);
  if (!mst) return { found: false, reason: "자치법규 일련번호(MST)를 확인하지 못했습니다.", debug };

  const bodyJson = await lawServiceOrdin(mst);
  debug.body = bodyJson;
  const joArray = findJoArray(bodyJson);
  const hits = joArray.filter((it) => {
    const text = joTitle(it) + " " + joText(it);
    return keywords.some((k) => text.includes(k));
  }).map((it) => ({ title: joTitle(it), text: joText(it) }))
    // 관련성이 높은(제목에 키워드가 직접 들어있는) 조문을 우선하고, 프롬프트가
    // 너무 커져서 응답이 잘리는 것을 막기 위해 상위 8건으로 제한한다.
    .sort((a, b) => {
      const score = (h) => keywords.reduce((s, k) => s + (h.title.includes(k) ? 2 : 0) + (h.text.includes(k) ? 1 : 0), 0);
      return score(b) - score(a);
    })
    .slice(0, 10);

  return { found: true, ordinName, mst, hits, debug };
}

// 검색된 조례 조문에서 건폐율·용적률 숫자를 직접 추출한다 (AI 호출 없이).
// "계획관리지역 : 40퍼센트 이하"처럼 조례 특유의 규칙적인 문장 패턴을 이용한다.
// AI 해석(api.anthropic.com 호출)은 claude.ai 미리보기 안에서만 작동하고
// 외부에 배포된 사이트에서는 CORS로 막히기 때문에, 창고시설 행위가능여부처럼
// 문장을 읽고 판단해야 하는 항목은 원문만 보여주고 자동 판정은 하지 않는다.
function extractZonePercent(text, zoneName) {
  if (!text || !zoneName) return null;
  const escaped = zoneName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const m = text.match(new RegExp(escaped + "\\s*[:：]\\s*([0-9]+(?:\\.[0-9]+)?)\\s*퍼센트"));
  return m ? m[1] : null;
}

const STEPS = [
  { num: "01", label: "지번 입력" },
  { num: "02", label: "지번별 법규 검토" },
  { num: "03", label: "건축 계획" },
  { num: "04", label: "인허가 검토" },
  { num: "05", label: "법규 검토서" },
];

let nextId = 2;
const initialParcels = [{ id: 1, lot: "", pnu: "", zoneName: "", jimok: "", area: "", cityName: "" }];

/* ------------------------------------------------------------------ */
/*  App                                                                */
/* ------------------------------------------------------------------ */
function App() {
  const [page, setPage] = useState("p1");
  const [parcels, setParcels] = useState(initialParcels);
  const [status, setStatus] = useState({});
  const [debugOpen, setDebugOpen] = useState({});
  const [lookupAllLoading, setLookupAllLoading] = useState(false);

  const validParcels = parcels.filter((p) => parseFloat(p.area) > 0);
  const totalArea = validParcels.reduce((s, p) => s + (parseFloat(p.area) || 0), 0);

  function addParcel() {
    nextId += 1;
    setParcels([...parcels, { id: nextId, lot: "", pnu: "", zoneName: "", jimok: "", area: "", cityName: "" }]);
  }
  function removeParcel(id) {
    setParcels(parcels.filter((p) => p.id !== id));
    setStatus((s) => { const n = { ...s }; delete n[id]; return n; });
  }
  function updateLot(id, value) { setParcels(parcels.map((p) => (p.id === id ? { ...p, lot: value } : p))); }

  async function lookupOne(id) {
    const p = parcels.find((pp) => pp.id === id);
    if (!p || !p.lot.trim()) { setStatus((s) => ({ ...s, [id]: { kind: "error", note: "지번을 먼저 입력하세요." } })); return; }
    setStatus((s) => ({ ...s, [id]: { loading: true } }));
    try {
      const r = await lookupViaVWorld(p.lot);
      if (r.success && r.zoneName) {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? { ...pp, pnu: r.pnu, zoneName: r.zoneName, jimok: r.jimok || pp.jimok, area: r.areaVal || pp.area, cityName: r.cityName || pp.cityName } : pp)));
        setStatus((s) => ({ ...s, [id]: { source: "vworld", debug: r.debug } }));
      } else if (r.success) {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? { ...pp, pnu: r.pnu, jimok: r.jimok || pp.jimok, area: r.areaVal || pp.area, cityName: r.cityName || pp.cityName } : pp)));
        setStatus((s) => ({ ...s, [id]: { kind: "notfound", note: "필지까지는 찾았지만 용도지역을 특정하지 못했습니다.", debug: r.debug } }));
      } else {
        setStatus((s) => ({ ...s, [id]: { kind: "notfound", note: r.reason, debug: r.debug } }));
      }
    } catch (e) {
      setStatus((s) => ({ ...s, [id]: { kind: "error", note: "브이월드 API 호출 중 오류가 발생했습니다 (네트워크 또는 domain 등록 URL 불일치일 수 있습니다). '원본 응답 보기'로 자세한 내용을 확인해주세요.", debug: { error: String(e) } } }));
    }
  }
  async function lookupAll() {
    setLookupAllLoading(true);
    for (const p of parcels) { if (p.lot.trim()) await lookupOne(p.id); }
    setLookupAllLoading(false);
  }

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">物流</div>
          <div className="brand-text"><h1>물류창고 법규검토</h1><p>DUGA CNC — 사내 실무 도구 프로토타입 · <span className="version-tag">{APP_VERSION}</span></p></div>
        </div>
      </div>
      <div className="stepper">
        {STEPS.map((s, i) => (
          <button
            key={s.num}
            className={`step ${page === "p" + (i + 1) ? "active" : (i < 2 ? "todo clickable" : "todo")}`}
            onClick={() => { if (i < 2) setPage("p" + (i + 1)); }}
            disabled={i >= 2}
          >
            <span className="step-num">{s.num}</span><span className="step-label">{s.label}</span>
          </button>
        ))}
      </div>

      <main className="content">
        {page === "p1" && (
          <Page1
            parcels={parcels} addParcel={addParcel} removeParcel={removeParcel} updateLot={updateLot}
            status={status} debugOpen={debugOpen} setDebugOpen={setDebugOpen}
            lookupOne={lookupOne} lookupAll={lookupAll} lookupAllLoading={lookupAllLoading}
            totalArea={totalArea} validParcels={validParcels}
            onNext={() => setPage("p2")}
          />
        )}
        {page === "p2" && <Page2 parcels={validParcels} onBack={() => setPage("p1")} />}
      </main>
    </div>
  );
}

function Page1({ parcels, addParcel, removeParcel, updateLot, status, debugOpen, setDebugOpen, lookupOne, lookupAll, lookupAllLoading, totalArea, validParcels, onNext }) {
  return (
    <div>
      <div className="sheet-header">
        <h2 className="sheet-title">지번 입력</h2>
        <p className="sheet-sub">지번은 여러 개 추가할 수 있습니다. 한 건의 사업이 여러 필지로 이루어진 경우 모두 추가해서 합쳐서 검토하세요.</p>
      </div>
      <div className="card">
        <div className="bulk-actions">
          <button className="add-btn" onClick={addParcel}>+ 지번 추가</button>
          <button className="primary-btn" onClick={lookupAll} disabled={lookupAllLoading}>{lookupAllLoading ? "전체 조회 중…" : "전체 조회"}</button>
        </div>
        <table className="parcel-table">
          <thead><tr><th style={{ width: "28%" }}>지번 주소</th><th style={{ width: "18%" }}>용도지역</th><th style={{ width: "14%" }}>지목</th><th style={{ width: "16%" }}>지적면적(㎡)</th><th style={{ width: "24%" }}>동작</th></tr></thead>
          <tbody>
            {parcels.map((p) => {
              const st = status[p.id];
              return (
                <React.Fragment key={p.id}>
                  <tr className="parcel-row">
                    <td><input type="text" placeholder="예: 경기도 여주시 연라동 552-7" value={p.lot} onChange={(e) => updateLot(p.id, e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") lookupOne(p.id); }} /></td>
                    <td className="readout">{p.zoneName || "-"}</td>
                    <td className="readout">{p.jimok || "-"}</td>
                    <td className="readout">{p.area ? fmt(p.area, 0) : "-"}</td>
                    <td>
                      <div className="action-stack">
                        <button className="primary-btn small" onClick={() => lookupOne(p.id)} disabled={st && st.loading}>{st && st.loading ? "조회 중…" : "조회"}</button>
                        {parcels.length > 1 && <button className="icon-btn" onClick={() => removeParcel(p.id)}>✕ 삭제</button>}
                      </div>
                    </td>
                  </tr>
                  {st && (
                    <tr className="status-row">
                      <td colSpan={5}>
                        {st.loading && <span className="status-loading">🔄 조회 중…</span>}
                        {!st.loading && st.kind === "error" && <span className="status-error">⚠ {st.note}</span>}
                        {!st.loading && st.kind === "notfound" && <span className="status-notfound">ⓘ {st.note}</span>}
                        {!st.loading && !st.kind && <span className="status-ok">브이월드 API 조회 결과</span>}
                        {st.debug && !st.loading && (
                          <>
                            {" "}<button className="link-btn" onClick={() => setDebugOpen((d) => ({ ...d, [p.id]: !d[p.id] }))}>{debugOpen[p.id] ? "원본 응답 닫기" : "원본 응답 보기"}</button>
                            {debugOpen[p.id] && <pre className="debug-pre">{JSON.stringify(st.debug, null, 2)}</pre>}
                          </>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        <div className="total-strip">
          <span>입력된 지번 <b>{parcels.length}</b>개</span><span>조회 완료 <b>{validParcels.length}</b>개</span><span>합계 대지면적 <b>{fmt(totalArea, 0)} ㎡</b></span>
        </div>
        <p className="source-note">실제 적용 전 <a href="https://www.eum.go.kr/web/am/amMain.jsp" target="_blank" rel="noreferrer">토지이음</a>에서 재확인이 필요합니다.</p>
      </div>
      <button className="next-btn active" onClick={onNext} disabled={validParcels.length === 0}>다음: 지번별 법규 검토 →</button>
    </div>
  );
}

function Topic({ title, lawText, lawArticle, ordinRow, ordinLoading, ordinText, ordinName, conclusion, conclusionTone, sourceKey, sourceOpen, setSourceOpen, sourceHits }) {
  return (
    <div className="topic">
      <div className="topic-title">{title}</div>
      <div className="topic-row">
        <span className="topic-label">상위법령</span>
        <span className="topic-value">{lawText}</span>
      </div>
      {lawArticle && <p className="topic-source">{lawArticle}</p>}
      {ordinRow && (
        <>
          <div className="topic-row" style={{ marginTop: 6 }}>
            <span className="topic-label">조례</span>
            <span className="topic-value">{ordinLoading ? "조회 중…" : (ordinText || "대기 중")}</span>
          </div>
          {!ordinLoading && ordinName && sourceHits && sourceHits.length > 0 && <p className="topic-source">{ordinName} {sourceHits.map((h) => h.title).join(", ")}</p>}
        </>
      )}
      {conclusion && (
        <div className="conclusion-row">
          <div className={`conclusion ${conclusionTone || "accent"}`}>{conclusion}</div>
        </div>
      )}
      {sourceHits && sourceHits.length > 0 && (
        <>
          <button className="link-btn" onClick={() => setSourceOpen((s) => ({ ...s, [sourceKey]: !s[sourceKey] }))}>
            {sourceOpen[sourceKey] ? "원문 닫기" : `원문 보기 (${sourceHits.length}건)`}
          </button>
          {sourceOpen[sourceKey] && sourceHits.map((h, i) => (
            <div className="source-box" key={i}><b>{h.title}</b><br />{h.text}</div>
          ))}
        </>
      )}
    </div>
  );
}

function Page2({ parcels, onBack }) {
  const [priceStatus, setPriceStatus] = useState({});
  const [reviewStatus, setReviewStatus] = useState({});
  const [sourceOpen, setSourceOpen] = useState({});
  const [debugOpen, setDebugOpen] = useState({});

  async function lookupPrice(p) {
    if (!p.pnu) return;
    setPriceStatus((s) => ({ ...s, [p.id]: { loading: true } }));
    try {
      const r = await vworldLandPrice(p.pnu);
      const list = (r && r.indvdLandPrices && r.indvdLandPrices.field) || [];
      // stdrYear(기준연도)가 가장 큰(최신) 항목을 선택
      let latest = null;
      list.forEach((item) => {
        const y = parseInt(item.stdrYear || item.stdrYr, 10);
        if (!latest || y > parseInt(latest.stdrYear || latest.stdrYr, 10)) latest = item;
      });
      const price = latest ? (latest.pblntfPclnd || latest.pubLandPrice) : null;
      const year = latest ? (latest.stdrYear || latest.stdrYr) : null;
      if (price) setPriceStatus((s) => ({ ...s, [p.id]: { price, year, raw: r } }));
      else setPriceStatus((s) => ({ ...s, [p.id]: { kind: "notfound", note: "공시지가 데이터를 찾지 못했습니다.", raw: r } }));
    } catch (e) {
      setPriceStatus((s) => ({ ...s, [p.id]: { kind: "error", note: "공시지가 API 호출 중 오류가 발생했습니다.", raw: { error: String(e) } } }));
    }
  }

  async function runReview(p) {
    const city = p.cityName || extractCityName(p.lot);
    if (!city) { setReviewStatus((s) => ({ ...s, [p.id]: { kind: "error", note: "시·군을 확인하지 못했습니다. 01에서 자동조회를 먼저 완료해주세요." } })); return; }
    setReviewStatus((s) => ({ ...s, [p.id]: { loading: true, city } }));
    try {
      const search = await fetchOrdinanceKeywordHits(city, ["창고", "건폐율", "용적률", "주차"]);
      if (!search.found) { setReviewStatus((s) => ({ ...s, [p.id]: { city, kind: "notfound", note: search.reason, debug: search.debug } })); return; }
      // AI 해석 없이, 조례 특유의 규칙적인 문장에서 직접 숫자를 뽑는다.
      const bcrHit = search.hits.find((h) => h.title.includes("건폐율"));
      const farHit = search.hits.find((h) => h.title.includes("용적률"));
      const warehouseHits = search.hits.filter((h) => (h.title + h.text).includes("창고"));
      const bcrPercent = bcrHit ? extractZonePercent(bcrHit.text, p.zoneName) : null;
      const farPercent = farHit ? extractZonePercent(farHit.text, p.zoneName) : null;
      setReviewStatus((s) => ({ ...s, [p.id]: {
        city, ordinName: search.ordinName, hits: search.hits,
        bcrPercent, bcrHit, farPercent, farHit, warehouseHits,
        debug: search.debug,
      }}));
    } catch (e) {
      setReviewStatus((s) => ({ ...s, [p.id]: { city, kind: "error", note: "조례 API 호출 중 오류가 발생했습니다 (CORS 또는 네트워크 문제일 수 있습니다).", debug: { error: String(e) } } }));
    }
  }

  // 02 페이지에 들어오면 각 필지의 공시지가·조례를 자동으로 순서대로 조회한다.
  useEffect(() => {
    let cancelled = false;
    async function runAll() {
      for (const p of parcels) {
        if (cancelled) return;
        await lookupPrice(p);
        if (cancelled) return;
        await runReview(p);
      }
    }
    runAll();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div>
      <div className="sheet-header">
        <h2 className="sheet-title">지번별 법규 검토</h2>
        <p className="sheet-sub">01에서 입력한 필지를 상위법령부터 지자체 조례까지 자동으로 검토해 항목별로 정리합니다.</p>
      </div>

      {parcels.map((p) => {
        const pr = priceStatus[p.id];
        const rv = reviewStatus[p.id];
        const zoneLimits = ZONE_LAW_LIMITS[p.zoneName] || null;
        const wh = zoneWarehouseLawText(p.zoneName);
        return (
          <div className="card" key={p.id}>
            <h3>{p.lot || "(지번 미입력)"} <span className="badge review">{p.zoneName || "용도지역 미확인"}</span></h3>
            <p className="parcel-sub">대지면적 {p.area ? fmt(p.area, 0) + "㎡" : "-"}</p>

            <Topic
              title="창고시설 행위가능여부"
              lawText={wh.text} lawArticle={wh.article}
              ordinRow={true} ordinLoading={rv && rv.loading}
              ordinText={rv && !rv.loading ? (rv.warehouseHits && rv.warehouseHits.length > 0 ? `관련 조문 ${rv.warehouseHits.length}건 발견 — 원문을 직접 확인해주세요` : (rv.note || "관련 조문을 찾지 못함")) : null}
              ordinName={rv && rv.ordinName}
              conclusion={rv && !rv.loading ? "조문을 직접 읽고 판단이 필요합니다 (자동 판정 없음)" : null}
              conclusionTone="warning"
              sourceKey={"wh-" + p.id} sourceOpen={sourceOpen} setSourceOpen={setSourceOpen} sourceHits={rv && rv.warehouseHits}
            />

            <Topic
              title="건폐율"
              lawText={zoneLimits ? `${zoneLimits.bcr}% 이하 (상한)` : "용도지역 확인 후 표시됩니다"}
              lawArticle="국토의 계획 및 이용에 관한 법률 시행령 제84조제1항 (2026.7.1 시행 기준)"
              ordinRow={true} ordinLoading={rv && rv.loading}
              ordinText={rv && !rv.loading ? (rv.bcrPercent ? `${rv.bcrPercent}%로 지정` : "조문에서 이 용도지역의 수치를 자동으로 찾지 못함 — 원문 직접 확인 필요") : null}
              ordinName={rv && rv.ordinName}
              conclusion={rv && rv.bcrPercent ? `적용 기준 — ${rv.bcrPercent}%` : (zoneLimits ? `시행령 상한 — ${zoneLimits.bcr}% (조례 확인 필요)` : null)}
              conclusionTone={rv && rv.bcrPercent ? "accent" : "warning"}
              sourceKey={"bcr-" + p.id} sourceOpen={sourceOpen} setSourceOpen={setSourceOpen} sourceHits={rv && rv.bcrHit ? [rv.bcrHit] : null}
            />

            <Topic
              title="용적률"
              lawText={zoneLimits ? `${zoneLimits.farMin ? zoneLimits.farMin + "~" : ""}${zoneLimits.farMax}% (범위)` : "용도지역 확인 후 표시됩니다"}
              lawArticle="국토의 계획 및 이용에 관한 법률 시행령 제85조제1항 (2026.7.1 시행 기준)"
              ordinRow={true} ordinLoading={rv && rv.loading}
              ordinText={rv && !rv.loading ? (rv.farPercent ? `${rv.farPercent}%로 지정` : "조문에서 이 용도지역의 수치를 자동으로 찾지 못함 — 원문 직접 확인 필요") : null}
              ordinName={rv && rv.ordinName}
              conclusion={rv && rv.farPercent ? `적용 기준 — ${rv.farPercent}%` : (zoneLimits ? `시행령 상한 — ${zoneLimits.farMax}% (조례 확인 필요)` : null)}
              conclusionTone={rv && rv.farPercent ? "accent" : "warning"}
              sourceKey={"far-" + p.id} sourceOpen={sourceOpen} setSourceOpen={setSourceOpen} sourceHits={rv && rv.farHit ? [rv.farHit] : null}
            />

            <Topic
              title="층수·높이제한"
              lawText="일조권 사선제한(정북방향 높이제한)은 전용주거·일반주거지역에만 적용됩니다. 이 용도지역은 해당 없음이 원칙입니다."
              lawArticle="건축법 제60조·제61조"
              conclusion="가로구역별 높이제한은 지자체가 별도 지정한 경우에만 있어 관할 구청 확인이 필요합니다"
              conclusionTone="warning"
            />

            <Topic
              title="건축선 규정"
              lawText="원칙적으로 대지와 도로의 경계선이 건축선입니다. 접한 도로 폭이 4m 미만이면 도로 중심선에서 소요너비의 1/2만큼 후퇴한 선이 건축선이 됩니다."
              lawArticle="건축법 제46조, 시행령 제31조"
              conclusion="접한 도로의 실제 폭을 현장에서 확인해야 정확한 건축선을 알 수 있습니다"
              conclusionTone="accent"
            />

            <Topic
              title="도로조건 규제사항"
              lawText="대지는 원칙적으로 2m 이상 도로에 접해야 합니다. 연면적 합계 2,000㎡ 이상인 건축물(창고시설 포함)은 너비 6m 이상 도로에 4m 이상 접해야 합니다."
              lawArticle="건축법 제44조, 시행령 제28조"
              conclusion="접한 도로 폭이 6m 이상인지 현장 확인이 필요합니다"
              conclusionTone="warning"
            />

            <div className="topic">
              <div className="topic-title">최근 공시지가</div>
              {!p.pnu && <p className="status-notfound">ⓘ 01에서 이 필지의 자동조회를 먼저 완료해야 PNU가 있어 조회할 수 있습니다.</p>}
              {!pr && p.pnu && <p className="status-loading">🔄 자동으로 조회하는 중…</p>}
              {pr && pr.price && (
                <>
                  <div className="conclusion accent">{fmt(pr.price, 0)} 원/㎡</div>
                  <p className="topic-source">브이월드 개별공시지가속성조회 API (기준연도 {pr.year})</p>
                </>
              )}
              {pr && pr.kind === "notfound" && <p className="status-notfound">ⓘ {pr.note}</p>}
              {pr && pr.kind === "error" && <p className="status-error">⚠ {pr.note}</p>}
            </div>

            <div className="topic-footer">
              {rv && rv.debug && (
                <>
                  <button className="link-btn" onClick={() => setDebugOpen((d) => ({ ...d, [p.id]: !d[p.id] }))}>{debugOpen[p.id] ? "원본 응답 닫기" : "원본 응답 보기"}</button>
                  {debugOpen[p.id] && <pre className="debug-pre">{JSON.stringify(rv.debug, null, 2)}</pre>}
                </>
              )}
            </div>
          </div>
        );
      })}

      <button className="add-btn" onClick={onBack}>← 01 지번 입력으로 돌아가기</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
