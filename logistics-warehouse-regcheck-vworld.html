function fmt(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ko-KR", { maximumFractionDigits: digits });
}
function zoneOf(key) { return ZONES.find((z) => z.key === key) || null; }
function matchZoneLabel(label) {
  if (!label) return null;
  let z = ZONES.find((zz) => zz.label === label);
  if (z) return z;
  z = ZONES.find((zz) => label.includes(zz.label) || zz.label.includes(label));
  return z || null;
}
// 응답 속성 전체를 훑어서 우리 ZONES 라벨과 일치하는 값을 가진 필드를 찾는다.
// 정확한 필드명을 몰라도 값 자체로 매칭하므로 필드명이 달라도 견딘다.
function guessZoneFromProperties(props) {
  if (!props) return null;
  for (const key of Object.keys(props)) {
    const val = props[key];
    if (typeof val === "string") {
      const z = matchZoneLabel(val);
      if (z) return { zone: z, field: key, raw: val };
    }
  }
  return null;
}
function Badge({ grade, children }) {
  const map = {
    confirmed: { cls: "badge-confirmed", text: "확정" },
    proposal: { cls: "badge-proposal", text: "제안" },
    review: { cls: "badge-review", text: "검토 필요" },
    mockup: { cls: "badge-mockup", text: "목업" },
  };
  const m = map[grade] || map.review;
  return <span className={`badge ${m.cls}`}>{children || m.text}</span>;
}
function parcelRows(parcels) {
  return parcels
    .filter((p) => p.zoneKey && parseFloat(p.area) > 0)
    .map((p) => {
      const z = zoneOf(p.zoneKey);
      const area = parseFloat(p.area) || 0;
      return { ...p, zone: z, area, maxFootprint: z ? (area * z.bcr) / 100 : null, maxFloor: z ? (area * z.farMax) / 100 : null };
    });
}
function zoneGroups(parcels) {
  const map = {};
  parcels.forEach((p) => {
    const a = parseFloat(p.area) || 0;
    if (!p.zoneKey || a <= 0) return;
    if (!map[p.zoneKey]) map[p.zoneKey] = 0;
    map[p.zoneKey] += a;
  });
  return Object.entries(map).map(([zoneKey, area]) => {
    const z = zoneOf(zoneKey);
    return { zoneKey, zone: z, area, maxFootprint: z ? (area * z.bcr) / 100 : null, maxFloor: z ? (area * z.farMax) / 100 : null, devExceeds: z ? area >= z.devLimit : null };
  });
}

/* ------------------------------------------------------------------ */
/*  브이월드 실 API 연동 (지오코딩 → 필지 PNU → 용도지역 레이어)        */
/* ------------------------------------------------------------------ */
// 브이월드 API는 브라우저 fetch()에 대해 CORS 허용 헤더를 보내주지 않아
// 표준 fetch로는 "Failed to fetch"가 발생합니다. <script> 태그로 불러오는
// JSONP 방식으로 우회합니다 (오래된 공공 API에서 흔한 패턴).
function vworldFetch(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "vworldCb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let timeoutId;
    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeoutId);
    }
    window[callbackName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("JSONP 요청 실패 (네트워크 또는 domain 등록 URL 불일치 가능성)")); };
    timeoutId = setTimeout(() => { cleanup(); reject(new Error("요청 시간 초과 (10초)")); }, 10000);
    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "callback=" + callbackName;
    document.head.appendChild(script);
  });
}
async function vworldGeocode(address) {
  const url = "https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326"
    + "&address=" + encodeURIComponent(address)
    + "&refine=true&simple=false&format=json&type=parcel"
    + "&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  return vworldFetch(url);
}
async function vworldData(layerId, attrFilter, extraParams) {
  let url = "https://api.vworld.kr/req/data?service=data&version=2.0&request=GetFeature&format=json&crs=epsg:4326"
    + "&size=5&page=1&data=" + layerId + "&geometry=false&attribute=true"
    + "&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  if (attrFilter) url += "&attrFilter=" + encodeURIComponent(attrFilter);
  if (extraParams) url += extraParams;
  return vworldFetch(url);
}
async function lookupViaVWorld(address) {
  const debug = {};
  const geo = await vworldGeocode(address);
  debug.step1_geocode = geo;
  const point = geo && geo.response && geo.response.result && geo.response.result.point;
  if (!point) {
    return { success: false, reason: "주소를 좌표로 변환하지 못했습니다 (지오코딩 실패). 지번 주소 표기를 확인해주세요.", debug };
  }
  const x = point.x, y = point.y;
  const cadastral = await vworldData("LP_PA_CBND_BUBUN", null, "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
  debug.step2_cadastral = cadastral;
  const feature = cadastral && cadastral.response && cadastral.response.result
    && cadastral.response.result.featureCollection && cadastral.response.result.featureCollection.features
    && cadastral.response.result.featureCollection.features[0];
  const props = (feature && feature.properties) || {};
  const pnu = props.pnu || props.PNU || null;
  if (!pnu) {
    return { success: false, reason: "좌표는 찾았지만 필지(PNU) 정보를 확인하지 못했습니다.", debug, coords: { x, y } };
  }
  // LX맵(편집지적도, LT_C_LANDINFOBASEMAP) — 지목·면적이 들어있는 것으로 확인된 레이어.
  // 정확한 필드명을 몰라 후보 필드명들을 순서대로 시도한다.
  function pickProp(p, candidates) {
    if (!p) return null;
    for (const c of candidates) {
      if (p[c] !== undefined && p[c] !== null && p[c] !== "") return p[c];
    }
    return null;
  }
  let jimok = null, areaVal = null;
  try {
    const landInfo = await vworldData("LT_C_LANDINFOBASEMAP", null, "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
    debug.step2b_landinfobasemap = landInfo;
    const lf = landInfo && landInfo.response && landInfo.response.result && landInfo.response.result.featureCollection
      && landInfo.response.result.featureCollection.features && landInfo.response.result.featureCollection.features[0];
    const lprops = (lf && lf.properties) || null;
    jimok = pickProp(lprops, ["jimok_nm", "JIMOK_NM", "jimok", "lndcgr_nm", "jimokNm"]);
    areaVal = pickProp(lprops, ["parea", "PAREA", "area", "AREA", "lndpcl_ar"]);
  } catch (e) {
    debug.step2b_landinfobasemap_error = String(e);
  }
  // 용도지역지구도 레이어(LT_C_UQ11x)는 pnu 속성이 없는 폴리곤 지도라서
  // attrFilter가 아니라 좌표 기반 공간조회(geomFilter)로 찾아야 한다.
  // "uname" 필드가 실제 용도지역명("계획관리지역" 등)을 담고 있는 것으로 확인됨.
  let zoneResult = null;
  for (const layer of ZONE_LAYERS) {
    const r = await vworldData(layer.id, null, "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
    debug["step3_zone_" + layer.id] = r;
    const f = r && r.response && r.response.result && r.response.result.featureCollection
      && r.response.result.featureCollection.features && r.response.result.featureCollection.features[0];
    if (f) {
      const props = f.properties || {};
      const uname = props.uname;
      const guess = (uname && matchZoneLabel(uname))
        ? { zone: matchZoneLabel(uname), field: "uname", raw: uname }
        : guessZoneFromProperties(props);
      zoneResult = { layerLabel: layer.label, properties: props, guess };
      break;
    }
  }
  return { success: true, pnu, cadastralProps: props, jimok, areaVal, zoneResult, debug };
}

// 보조 수단: 웹검색 기반 자동조회 (브이월드에서 못 찾았을 때 재시도용)
async function searchParcelInfo(lotAddress) {
  const prompt = `다음 지번 주소의 토지이용계획 정보를 웹검색으로 찾아줘: "${lotAddress}"
국토교통부 토지이음(eum.go.kr), 브이월드, 디스코(disco.re), 밸류맵(valueupmap.com), 랜드북(landbook.net), 씨리얼(seereal.lh.or.kr) 등을 검색해봐.
찾은 내용만 사용하고 절대로 추정값을 만들어내지 마. 확실하지 않으면 found를 false로 하고 이유를 note에 적어.
다른 설명 없이 아래 JSON 형식으로만 답변해:
{"found": true 또는 false, "zoneLabel": "용도지역명(예: 계획관리지역)", "landCategory": "지목", "area": 지적면적_숫자_제곱미터_모르면_null, "note": "확인 근거나 못 찾은 이유를 짧게", "sourceUrl": "참고한 URL(있으면)"}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!response.ok) throw new Error(`API 요청 실패 (${response.status})`);
  const data = await response.json();
  const textBlocks = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  const match = textBlocks.replace(/```json|```/g, "").match(/\{[\s\S]*\}/);
  if (!match) throw new Error("응답 형식을 해석하지 못했습니다.");
  return JSON.parse(match[0]);
}

function App() {
  const [sheet, setSheet] = useState("overview");
  const [parcels, setParcels] = useState(initialParcels);
  const [parcelStatus, setParcelStatus] = useState({}); // id -> {loading, kind, note, source, debug, unmatchedFound}
  const [lookupAllLoading, setLookupAllLoading] = useState(false);
  const [facilityKey, setFacilityKey] = useState("warehouse");
  const [footprint, setFootprint] = useState("9500");
  const [floorAreaTotal, setFloorAreaTotal] = useState("21000");
  const [viewMode, setViewMode] = useState("sum");

  const parking = PARKING_TYPES.find((p) => p.key === facilityKey);
  const validParcels = parcels.filter((p) => p.zoneKey && parseFloat(p.area) > 0);
  const totalSiteArea = validParcels.reduce((s, p) => s + (parseFloat(p.area) || 0), 0);
  const groups = zoneGroups(parcels);
  const rows = parcelRows(parcels);
  const maxFootprintAllowed = groups.reduce((s, g) => s + (g.maxFootprint || 0), 0);
  const maxFloorAllowed = groups.reduce((s, g) => s + (g.maxFloor || 0), 0);
  const nFootprint = parseFloat(footprint) || 0;
  const nFloor = parseFloat(floorAreaTotal) || 0;
  const bcrActual = totalSiteArea > 0 ? (nFootprint / totalSiteArea) * 100 : null;
  const farActual = totalSiteArea > 0 ? (nFloor / totalSiteArea) * 100 : null;
  const parkingRequired = parking && nFloor > 0 ? Math.ceil(nFloor / parking.ratio) : null;
  const tia = TIA_THRESHOLD[facilityKey] || TIA_THRESHOLD.other;
  const tiaTarget = tia.normal !== null && nFloor > 0 ? nFloor >= tia.normal : null;
  const disasterTarget = totalSiteArea > 0 ? totalSiteArea >= 5000 : null;

  function addParcel() {
    nextId += 1;
    setParcels([...parcels, { id: nextId, lot: "", pnu: "", zoneKey: "plan-mgmt", landCategory: "", area: "" }]);
  }
  function removeParcel(id) {
    setParcels(parcels.filter((p) => p.id !== id));
    setParcelStatus((s) => { const n = { ...s }; delete n[id]; return n; });
  }
  function updateParcel(id, field, value) {
    setParcels(parcels.map((p) => (p.id === id ? { ...p, [field]: value } : p)));
  }

  async function lookupParcelVWorld(id) {
    const p = parcels.find((pp) => pp.id === id);
    if (!p || !p.lot || !p.lot.trim()) {
      setParcelStatus((s) => ({ ...s, [id]: { kind: "error", note: "지번 주소를 먼저 입력하세요." } }));
      return;
    }
    setParcelStatus((s) => ({ ...s, [id]: { loading: true } }));
    try {
      const result = await lookupViaVWorld(p.lot);
      if (result.success && result.zoneResult && result.zoneResult.guess) {
        const g = result.zoneResult.guess;
        setParcels((prev) => prev.map((pp) => (pp.id === id ? {
          ...pp, zoneKey: g.zone.key, pnu: result.pnu,
          landCategory: result.jimok ? String(result.jimok) : pp.landCategory,
          area: result.areaVal ? String(result.areaVal) : pp.area,
        } : pp)));
        setParcelStatus((s) => ({ ...s, [id]: {
          kind: "ok", source: "vworld",
          note: `브이월드 ${result.zoneResult.layerLabel} 레이어에서 "${g.raw}" 확인 (필드: ${g.field})`
            + (result.jimok || result.areaVal ? ` · 지목/면적도 LX맵에서 자동 반영됨` : ""),
          debug: result.debug,
        }}));
      } else if (result.success && result.zoneResult) {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? {
          ...pp, pnu: result.pnu,
          landCategory: result.jimok ? String(result.jimok) : pp.landCategory,
          area: result.areaVal ? String(result.areaVal) : pp.area,
        } : pp)));
        setParcelStatus((s) => ({ ...s, [id]: {
          kind: "notfound", source: "vworld",
          note: `PNU(${result.pnu})까지는 찾았지만, 응답에서 용도지역명을 자동으로 특정하지 못했습니다. 아래 원본 응답을 펼쳐서 직접 확인해주세요.`,
          debug: result.debug,
        }}));
      } else {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? {
          ...pp, pnu: result.pnu || pp.pnu,
          landCategory: result.jimok ? String(result.jimok) : pp.landCategory,
          area: result.areaVal ? String(result.areaVal) : pp.area,
        } : pp)));
        setParcelStatus((s) => ({ ...s, [id]: { kind: "notfound", source: "vworld", note: result.reason, debug: result.debug } }));
      }
    } catch (e) {
      setParcelStatus((s) => ({ ...s, [id]: {
        kind: "error", source: "vworld",
        note: "브이월드 API 호출 중 오류가 발생했습니다 (네트워크 또는 domain 등록 URL 불일치일 수 있습니다). 아래 'AI 웹검색으로 재조회'를 시도해보세요.",
        debug: { error: String(e) },
      }}));
    }
  }

  async function lookupParcelAI(id) {
    const p = parcels.find((pp) => pp.id === id);
    if (!p || !p.lot || !p.lot.trim()) return;
    setParcelStatus((s) => ({ ...s, [id]: { loading: true } }));
    try {
      const result = await searchParcelInfo(p.lot);
      if (result.found) {
        const matchedZone = matchZoneLabel(result.zoneLabel);
        setParcels((prev) => prev.map((pp) => (pp.id === id ? {
          ...pp,
          zoneKey: matchedZone ? matchedZone.key : pp.zoneKey,
          landCategory: result.landCategory || pp.landCategory,
          area: result.area ? String(result.area) : pp.area,
        } : pp)));
        setParcelStatus((s) => ({ ...s, [id]: {
          kind: "ok", source: "ai",
          note: result.note || "웹검색 기반 자동조회 결과입니다.",
          sourceUrl: result.sourceUrl || "",
          unmatchedZone: !matchedZone && result.zoneLabel ? result.zoneLabel : null,
        }}));
      } else {
        setParcelStatus((s) => ({ ...s, [id]: { kind: "notfound", source: "ai", note: result.note || "공개된 자료에서 이 필지의 정보를 찾지 못했습니다." } }));
      }
    } catch (e) {
      setParcelStatus((s) => ({ ...s, [id]: { kind: "error", source: "ai", note: "AI 웹검색 자동조회 중 오류가 발생했습니다." } }));
    }
  }

  async function lookupAll() {
    setLookupAllLoading(true);
    for (const p of parcels) {
      if (p.lot && p.lot.trim()) {
        await lookupParcelVWorld(p.id);
      }
    }
    setLookupAllLoading(false);
  }

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">物流</div>
          <div className="brand-text">
            <h1>물류창고 법규검토</h1>
            <p>DUGA CNC — 사내 실무 도구 프로토타입 · 브이월드 자동조회</p>
          </div>
        </div>
        <div className="stage-pill">
          현재 <b>1단계 · 사내 실무 도구</b> 운영 중 · 2단계(서류 자동생성)·3단계(대외 보고)는 목업
        </div>
      </div>

      <div className="layout">
        <nav className="rail">
          {SHEETS.map((s) => (
            <button key={s.id} className={`rail-item ${sheet === s.id ? "active" : ""}`} onClick={() => setSheet(s.id)}>
              <span className="rail-num">{s.num}</span>
              <span>{s.label}</span>
              {s.phase && <span className="rail-phase-tag">{s.phase}단계</span>}
            </button>
          ))}
        </nav>

        <main className="content">
          {sheet === "overview" && <Overview />}
          {sheet === "site" && (
            <ParcelInput
              parcels={parcels} addParcel={addParcel} removeParcel={removeParcel} updateParcel={updateParcel}
              facilityKey={facilityKey} setFacilityKey={setFacilityKey} totalSiteArea={totalSiteArea}
              validCount={validParcels.length} parcelStatus={parcelStatus}
              onLookupVWorld={lookupParcelVWorld} onLookupAI={lookupParcelAI}
              onLookupAll={lookupAll} lookupAllLoading={lookupAllLoading}
            />
          )}
          {sheet === "checklist" && (
            <Checklist groups={groups} totalSiteArea={totalSiteArea} tia={tia} tiaTarget={tiaTarget} disasterTarget={disasterTarget} />
          )}
          {sheet === "calculator" && (
            <Calculator
              viewMode={viewMode} setViewMode={setViewMode} groups={groups} rows={rows} totalSiteArea={totalSiteArea}
              footprint={footprint} setFootprint={setFootprint} floorAreaTotal={floorAreaTotal} setFloorAreaTotal={setFloorAreaTotal}
              facilityKey={facilityKey} setFacilityKey={setFacilityKey} bcrActual={bcrActual} farActual={farActual}
              maxFootprintAllowed={maxFootprintAllowed} maxFloorAllowed={maxFloorAllowed}
              parkingRequired={parkingRequired} parking={parking}
            />
          )}
          {sheet === "docs" && <DocsMockup />}
          {sheet === "report" && <ReportMockup />}
        </main>
      </div>
    </div>
  );
}

        합니다. 건폐율·용적률·주차대수 등은 법령상 <b>상한 기준</b>이며, 실제 적용 수치는 관할 지자체의

          <span><span className="dot" style={{ background: "var(--review)" }} /> <b>검토 필요</b> — 참고자료로 교차확인, 조례 등 추가 확인 필요</span>
          <span><span className="dot" style={{ background: "var(--proposal)" }} /> <b>제안</b> — 담당자 확인이 필요한 실무 제안</span>
          <span><span className="dot" style={{ background: "var(--mockup)" }} /> <b>목업</b> — 2·3단계 예정 기능</span>
        </div>

function ParcelInput({ parcels, addParcel, removeParcel, updateParcel, facilityKey, setFacilityKey, totalSiteArea, validCount, parcelStatus, onLookupVWorld, onLookupAI, onLookupAll, lookupAllLoading }) {
  const [debugOpen, setDebugOpen] = useState({});
  return (
    <div>
      <div className="sheet-header">
        <p className="sheet-eyebrow">02 · 필지(지번) 입력</p>

      </div>
      <div className="card">
        <h3>시설유형 <Badge grade="proposal">프로젝트 공통</Badge></h3>
        <div className="field-grid" style={{ maxWidth: 260 }}>
          <div className="field">

        </div>
        <table className="parcel-table">
          <thead>
            <tr>
              <th style={{ width: "22%" }}>지번 주소</th>

              <th style={{ width: "15%" }}>용도지역</th>
              <th style={{ width: "10%" }}>지목</th>

              <th style={{ width: "16%" }}>동작</th>

              return (
                <React.Fragment key={p.id}>
                  <tr className="parcel-row">
                    <td><input type="text" placeholder="예: 경기도 여주시 ○○면 ○○리 123-4" value={p.lot} onChange={(e) => updateParcel(p.id, "lot", e.target.value)} /></td>

                      </select>

                    <td><input type="text" placeholder="예: 공장용지" value={p.landCategory} onChange={(e) => updateParcel(p.id, "landCategory", e.target.value)} /></td>

                      </div>
                    </td>
                  </tr>
                  {st && (
                    <tr className="status-row">
                      <td colSpan={6}>
                        {st.loading && <span className="status-loading">🔄 조회 중…</span>}

                        {!st.loading && st.kind === "notfound" && <span className="status-notfound">ⓘ {st.note}</span>}
                        {!st.loading && st.kind === "ok" && (
                          <span className="status-ok">
                            <Badge grade={st.source === "vworld" ? "confirmed" : "review"}>{st.source === "vworld" ? "브이월드 API 조회" : "AI 웹검색 조회"}</Badge> {st.note}
                            {st.unmatchedZone && ` — "${st.unmatchedZone}"은 목록에 없는 용도지역이라 자동 반영되지 않았습니다.`}
                            {st.sourceUrl && (<> · <a href={st.sourceUrl} target="_blank" rel="noreferrer">참고 링크</a></>)}
                          </span>
                        )}
                        {st.debug && !st.loading && (
                          <div style={{ marginTop: 6 }}>
                            <button className="link-btn" style={{ cursor: "pointer" }} onClick={() => setDebugOpen((d) => ({ ...d, [p.id]: !d[p.id] }))}>
                              {debugOpen[p.id] ? "원본 응답 닫기" : "원본 응답 보기"}
                            </button>
                            {debugOpen[p.id] && <pre className="debug-pre">{JSON.stringify(st.debug, null, 2)}</pre>}
                          </div>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        <div className="total-strip">
          <span>입력된 필지 <b>{parcels.length}</b>개</span>
          <span>유효 필지(용도지역·면적 입력됨) <b>{validCount}</b>개</span>
          <span>합계 대지면적 <b>{fmt(totalSiteArea, 0)} ㎡</b></span>
        </div>
        <p className="source-note">
          여러 필지가 서로 다른 용도지역에 걸치는 경우, 개발행위허가 규모는 필지가 아니라 용도지역 단위로
          합산해 판단합니다 (국토의 계획 및 이용에 관한 법률 시행령 제55조제2항).
        </p>
      </div>
    </div>
  );
}

      <div className="card" style={{ marginTop: 8 }}>
        <h3>지역별 조례 확인 절차 <Badge grade="proposal" /></h3>
        <p className="check-desc" style={{ margin: 0 }}>위 기준은 모두 국가 법령상 상한·전국 공통 기준입니다. 실제 사업 대상지의 시·군·구 조례는 별도로 확인해야 합니다 — 담당자 확인 필요.</p>
      </div>

function ChecklistItem({ title, grade, target, desc, source }) {
  const dotColor = target === null ? "var(--mockup)" : target ? "var(--review)" : "var(--confirmed)";
  const statusText = target === null ? "판단 보류 (입력값 확인)" : target ? "대상 가능성 있음" : "기준 미만 (대상 아님)";
  return (
    <div className="card">
      <div className="checklist-item" style={{ paddingTop: 0, paddingBottom: 0, border: "none" }}>
        <span className="check-dot" style={{ background: dotColor }} />
        <div style={{ width: "100%" }}>
          <p className="check-title">{title}<Badge grade={grade} /></p>
          <p className="check-desc">{desc}</p>
          <div className="source-note"><span>출처: {source}</span></div>
          <p style={{ fontSize: 12.5, color: "var(--ink-soft)", marginTop: 6 }}>판정 결과: <b style={{ color: dotColor }}>{statusText}</b></p>
        </div>
      </div>
    </div>
  );
}

            {groups.length > 1 && (
              <table className="zone-table" style={{ marginTop: 16 }}>
                <thead><tr><th>용도지역</th><th>합계 면적</th><th>건폐율 상한</th><th>허용 건축면적</th><th>용적률 상한</th><th>허용 연면적</th></tr></thead>
                <tbody>{groups.map((g) => (<tr key={g.zoneKey}><td>{g.zone.label}</td><td>{fmt(g.area, 0)}㎡</td><td>{g.zone.bcr}%</td><td>{fmt(g.maxFootprint, 0)}㎡</td><td>{g.zone.farMax}%</td><td>{fmt(g.maxFloor, 0)}㎡</td></tr>))}</tbody>
              </table>
            )}
          </>
        )}
        {viewMode === "byParcel" && (
          <table className="zone-table">
            <thead><tr><th>지번</th><th>용도지역</th><th>지적면적</th><th>건폐율 상한</th><th>허용 건축면적</th><th>용적률 상한</th><th>허용 연면적</th></tr></thead>
            <tbody>
              {rows.length === 0 && (<tr><td colSpan={7} style={{ color: "var(--ink-soft)" }}>02에서 필지를 먼저 입력하세요.</td></tr>)}
              {rows.map((r) => (<tr key={r.id}><td>{r.lot || "(지번 미입력)"}</td><td>{r.zone.label}</td><td>{fmt(r.area, 0)}㎡</td><td>{r.zone.bcr}%</td><td>{fmt(r.maxFootprint, 0)}㎡</td><td>{r.zone.farMax}%</td><td>{fmt(r.maxFloor, 0)}㎡</td></tr>))}
            </tbody>
          </table>
        )}
        <p className="source-note">출처: 국토의 계획 및 이용에 관한 법률 시행령 제84조·제85조 (법정 상한, 조례로 별도 확정 — 조례 확인 필요)</p>
      </div>
      <div className="card">
        <h3>부설주차장 대수 <Badge grade="confirmed" /></h3>
        <div className="result-grid">
          <div className="result-box"><div className="result-label">산정 기준</div><div className="result-value" style={{ fontSize: 16 }}>{parking ? `${fmt(parking.ratio, 0)}㎡당 1대` : "-"}</div></div>
          <div className="result-box"><div className="result-label">필요 주차대수</div><div className="result-value">{parkingRequired !== null ? `${fmt(parkingRequired, 0)}대` : "-"}</div></div>
        </div>
        <p className="source-note">출처: 주차장법 시행령 [별표 1] 부설주차장의 설치대상 시설물 종류 및 설치기준(제6조제1항 관련)</p>
      </div>
    </div>
  );
}

function DocsMockup() {
  const docs = ["개발행위허가 신청서", "재해영향평가(성) 검토 협의요청서", "교통영향평가서 (요약)", "건축허가 신청서"];

function ReportMockup() {

</script>
