<script type="text/babel" data-presets="react">
const { useState } = React;

/* ------------------------------------------------------------------ */
/*  API 설정                                                           */
/* ------------------------------------------------------------------ */
const VWORLD_KEY = "D36CAB8C-CF18-43B8-861D-9A4751FC00FC";
const VWORLD_DOMAIN = window.location.origin;
const LAW_OC = "qazwsxedcrfv753"; // 법제처 open.law.go.kr 인증값
const ZONE_LAYERS = [
  { id: "LT_C_UQ111", label: "도시지역" },
  { id: "LT_C_UQ112", label: "관리지역" },
  { id: "LT_C_UQ113", label: "농림지역" },
  { id: "LT_C_UQ114", label: "자연환경보전지역" },
];
const ZONE_NAMES = [
  "계획관리지역", "생산관리지역", "보전관리지역", "자연녹지지역", "생산녹지지역", "보전녹지지역",
  "전용공업지역", "일반공업지역", "준공업지역", "농림지역", "자연환경보전지역",
  "제1종전용주거지역", "제2종전용주거지역", "제1종일반주거지역", "제2종일반주거지역", "제3종일반주거지역",
  "준주거지역", "중심상업지역", "일반상업지역", "근린상업지역", "유통상업지역",
];
function matchZoneName(text) { return text ? (ZONE_NAMES.find((n) => text.includes(n)) || null) : null; }
function fmt(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return Number(n).toLocaleString("ko-KR", { maximumFractionDigits: digits });
}
// 지번 주소에서 "OO시" 또는 "OO군" 토큰을 찾아 시군명을 추정 (조례 검색용)
function extractCityName(address) {
  if (!address) return null;
  const tokens = address.trim().split(/\s+/);
  for (const t of tokens) {
    if (/[가-힣]+시$/.test(t) && !/(특별시|광역시|자치시)$/.test(t)) return t;
    if (/[가-힣]+군$/.test(t)) return t;
  }
  for (const t of tokens) {
    if (/(특별시|광역시|특별자치시|특별자치도)$/.test(t)) return t;
  }
  return null;
}

/* ------------------------------------------------------------------ */
/*  브이월드 JSONP 호출                                                */
/* ------------------------------------------------------------------ */
function vworldFetch(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "vworldCb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let timeoutId;
    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeoutId);
    }
    window[callbackName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("JSONP 요청 실패 (네트워크 또는 domain 등록 URL 불일치 가능성)")); };
    timeoutId = setTimeout(() => { cleanup(); reject(new Error("요청 시간 초과 (10초)")); }, 10000);
    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "callback=" + callbackName;
    document.head.appendChild(script);
  });
}
async function vworldGeocode(address) {
  const url = "https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326"
    + "&address=" + encodeURIComponent(address)
    + "&refine=true&simple=false&format=json&type=parcel"
    + "&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  return vworldFetch(url);
}
async function vworldData(layerId, extraParams) {
  let url = "https://api.vworld.kr/req/data?service=data&version=2.0&request=GetFeature&format=json&crs=epsg:4326"
    + "&size=5&page=1&data=" + layerId + "&geometry=false&attribute=true"
    + "&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  if (extraParams) url += extraParams;
  return vworldFetch(url);
}
async function vworldLandPrice(pnu) {
  const url = "https://api.vworld.kr/ned/data/getIndvdLandPriceAttr?pnu=" + encodeURIComponent(pnu)
    + "&format=json&numOfRows=1&pageNo=1&key=" + VWORLD_KEY + "&domain=" + encodeURIComponent(VWORLD_DOMAIN);
  return vworldFetch(url);
}
function pickProp(p, candidates) {
  if (!p) return null;
  for (const c of candidates) { if (p[c] !== undefined && p[c] !== null && p[c] !== "") return p[c]; }
  return null;
}
function firstFeature(resp) {
  return resp && resp.response && resp.response.result && resp.response.result.featureCollection
    && resp.response.result.featureCollection.features && resp.response.result.featureCollection.features[0];
}

async function lookupViaVWorld(address) {
  const debug = {};
  const geo = await vworldGeocode(address);
  debug.step1_geocode = geo;
  const point = geo && geo.response && geo.response.result && geo.response.result.point;
  if (!point) return { success: false, reason: "주소를 좌표로 변환하지 못했습니다.", debug };
  const x = point.x, y = point.y;

  const cadastral = await vworldData("LP_PA_CBND_BUBUN", "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
  debug.step2_cadastral = cadastral;
  const cprops = ((firstFeature(cadastral) || {}).properties) || {};
  const pnu = cprops.pnu || cprops.PNU || null;
  if (!pnu) return { success: false, reason: "좌표는 찾았지만 필지 정보를 확인하지 못했습니다.", debug };

  let jimok = null, areaVal = null;
  try {
    const landInfo = await vworldData("LT_C_LANDINFOBASEMAP", "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
    debug.step3_landinfobasemap = landInfo;
    const lprops = (firstFeature(landInfo) || {}).properties || null;
    jimok = pickProp(lprops, ["jimok_nm", "JIMOK_NM", "jimok", "lndcgr_nm", "jimokNm"]);
    areaVal = pickProp(lprops, ["parea", "PAREA", "area", "AREA", "lndpcl_ar"]);
  } catch (e) { debug.step3_error = String(e); }

  let zoneName = null;
  for (const layer of ZONE_LAYERS) {
    const r = await vworldData(layer.id, "&geomFilter=" + encodeURIComponent(`POINT(${x} ${y})`));
    debug["step4_zone_" + layer.id] = r;
    const f = firstFeature(r);
    if (f) {
      const props = f.properties || {};
      zoneName = (props.uname && matchZoneName(props.uname)) ? props.uname : matchZoneName(JSON.stringify(props));
      break;
    }
  }
  return { success: true, pnu, jimok, areaVal, zoneName, debug };
}

async function searchParcelInfo(lotAddress) {
  const prompt = `다음 지번 주소의 토지이용계획 정보를 웹검색으로 찾아줘: "${lotAddress}"
국토교통부 토지이음(eum.go.kr), 브이월드, 디스코(disco.re), 밸류맵(valueupmap.com), 랜드북(landbook.net), 씨리얼(seereal.lh.or.kr) 등을 검색해봐.
찾은 내용만 사용하고 절대로 추정값을 만들어내지 마. 확실하지 않으면 found를 false로 하고 이유를 note에 적어.
다른 설명 없이 아래 JSON 형식으로만 답변해:
{"found": true 또는 false, "zoneLabel": "용도지역명(예: 계획관리지역)", "landCategory": "지목", "area": 지적면적_숫자_제곱미터_모르면_null, "note": "확인 근거나 못 찾은 이유를 짧게", "sourceUrl": "참고한 URL(있으면)"}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: 1500,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!response.ok) throw new Error(`API 요청 실패 (${response.status})`);
  const data = await response.json();
  const textBlocks = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  const match = textBlocks.replace(/```json|```/g, "").match(/\{[\s\S]*\}/);
  if (!match) throw new Error("응답 형식을 해석하지 못했습니다.");
  return JSON.parse(match[0]);
}

/* ------------------------------------------------------------------ */
/*  법제처 자치법규 API                                                */
/* ------------------------------------------------------------------ */
async function lawSearchOrdin(query) {
  const url = "https://www.law.go.kr/DRF/lawSearch.do?OC=" + encodeURIComponent(LAW_OC)
    + "&target=ordin&type=JSON&display=20&query=" + encodeURIComponent(query);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function lawServiceOrdin(mst) {
  const url = "https://www.law.go.kr/DRF/lawService.do?OC=" + encodeURIComponent(LAW_OC)
    + "&target=ordin&type=JSON&MST=" + encodeURIComponent(mst);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
// 응답 JSON 구조가 불확실하므로, 객체를 재귀적으로 훑어 자치법규명이 들어있는
// 항목과 조문 배열을 최대한 유연하게 찾아낸다.
function deepFindArrays(obj, out) {
  if (!obj || typeof obj !== "object") return;
  if (Array.isArray(obj)) { out.push(obj); obj.forEach((it) => deepFindArrays(it, out)); return; }
  Object.values(obj).forEach((v) => deepFindArrays(v, out));
}
function findOrdinCandidates(searchJson, keyword) {
  const arrays = [];
  deepFindArrays(searchJson, arrays);
  const items = [];
  arrays.forEach((arr) => arr.forEach((it) => {
    if (it && typeof it === "object") {
      const name = Object.entries(it).find(([k, v]) => k.includes("자치법규명") || k === "법령명한글");
      if (name && typeof name[1] === "string" && name[1].includes(keyword)) items.push(it);
    }
  }));
  return items;
}
function findJoArray(serviceJson) {
  const arrays = [];
  deepFindArrays(serviceJson, arrays);
  // "조내용" 또는 "조문내용" 필드를 가진 항목들이 들어있는 배열을 조문 배열로 간주
  let best = null, bestScore = 0;
  arrays.forEach((arr) => {
    const score = arr.filter((it) => it && typeof it === "object"
      && Object.keys(it).some((k) => k.includes("조내용") || k.includes("조문내용"))).length;
    if (score > bestScore) { bestScore = score; best = arr; }
  });
  return best || [];
}
function joText(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("조내용") || k.includes("조문내용"));
  return entry ? String(entry[1]) : "";
}
function joTitle(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("조제목"));
  return entry ? String(entry[1]) : "";
}
function mstOf(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("자치법규일련번호") || k === "MST");
  return entry ? String(entry[1]) : null;
}
function nameOf(item) {
  const entry = Object.entries(item).find(([k]) => k.includes("자치법규명"));
  return entry ? String(entry[1]) : "";
}

async function fetchOrdinanceKeywordHits(cityName, keywords) {
  const debug = {};
  const query = `${cityName} 도시계획 조례`;
  const searchJson = await lawSearchOrdin(query);
  debug.search = searchJson;
  const candidates = findOrdinCandidates(searchJson, "도시계획 조례");
  if (candidates.length === 0) {
    return { found: false, reason: `"${query}" 검색 결과에서 도시계획 조례를 찾지 못했습니다.`, debug };
  }
  const mst = mstOf(candidates[0]);
  const ordinName = nameOf(candidates[0]);
  if (!mst) return { found: false, reason: "자치법규 일련번호(MST)를 확인하지 못했습니다.", debug };

  const bodyJson = await lawServiceOrdin(mst);
  debug.body = bodyJson;
  const joArray = findJoArray(bodyJson);
  const hits = joArray.filter((it) => {
    const text = joTitle(it) + " " + joText(it);
    return keywords.some((k) => text.includes(k));
  }).map((it) => ({ title: joTitle(it), text: joText(it) }));

  return { found: true, ordinName, mst, hits, debug };
}

const STEPS = [
  { num: "01", label: "지번 입력" },
  { num: "02", label: "지번별 법규 검토" },
  { num: "03", label: "건축 계획" },
  { num: "04", label: "인허가 검토" },
  { num: "05", label: "법규 검토서" },
];

let nextId = 2;
const initialParcels = [{ id: 1, lot: "", pnu: "", zoneName: "", jimok: "", area: "" }];

/* ------------------------------------------------------------------ */
/*  App                                                                */
/* ------------------------------------------------------------------ */
function App() {
  const [page, setPage] = useState("p1");
  const [parcels, setParcels] = useState(initialParcels);
  const [status, setStatus] = useState({});
  const [debugOpen, setDebugOpen] = useState({});
  const [lookupAllLoading, setLookupAllLoading] = useState(false);

  const validParcels = parcels.filter((p) => parseFloat(p.area) > 0);
  const totalArea = validParcels.reduce((s, p) => s + (parseFloat(p.area) || 0), 0);

  function addParcel() {
    nextId += 1;
    setParcels([...parcels, { id: nextId, lot: "", pnu: "", zoneName: "", jimok: "", area: "" }]);
  }
  function removeParcel(id) {
    setParcels(parcels.filter((p) => p.id !== id));
    setStatus((s) => { const n = { ...s }; delete n[id]; return n; });
  }
  function updateLot(id, value) { setParcels(parcels.map((p) => (p.id === id ? { ...p, lot: value } : p))); }

  async function lookupOne(id) {
    const p = parcels.find((pp) => pp.id === id);
    if (!p || !p.lot.trim()) { setStatus((s) => ({ ...s, [id]: { kind: "error", note: "지번을 먼저 입력하세요." } })); return; }
    setStatus((s) => ({ ...s, [id]: { loading: true } }));
    try {
      const r = await lookupViaVWorld(p.lot);
      if (r.success && r.zoneName) {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? { ...pp, pnu: r.pnu, zoneName: r.zoneName, jimok: r.jimok || pp.jimok, area: r.areaVal || pp.area } : pp)));
        setStatus((s) => ({ ...s, [id]: { source: "vworld", debug: r.debug } }));
      } else if (r.success) {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? { ...pp, pnu: r.pnu, jimok: r.jimok || pp.jimok, area: r.areaVal || pp.area } : pp)));
        setStatus((s) => ({ ...s, [id]: { kind: "notfound", note: "필지까지는 찾았지만 용도지역을 특정하지 못했습니다.", debug: r.debug } }));
      } else {
        setStatus((s) => ({ ...s, [id]: { kind: "notfound", note: r.reason, debug: r.debug } }));
      }
    } catch (e) {
      setStatus((s) => ({ ...s, [id]: { kind: "error", note: "브이월드 API 호출 중 오류가 발생했습니다. 'AI 웹검색'으로 재조회해보세요.", debug: { error: String(e) } } }));
    }
  }
  async function lookupOneAI(id) {
    const p = parcels.find((pp) => pp.id === id);
    if (!p || !p.lot.trim()) return;
    setStatus((s) => ({ ...s, [id]: { loading: true } }));
    try {
      const r = await searchParcelInfo(p.lot);
      if (r.found) {
        setParcels((prev) => prev.map((pp) => (pp.id === id ? { ...pp, zoneName: r.zoneLabel || pp.zoneName, jimok: r.landCategory || pp.jimok, area: r.area || pp.area } : pp)));
        setStatus((s) => ({ ...s, [id]: { source: "ai", sourceUrl: r.sourceUrl } }));
      } else {
        setStatus((s) => ({ ...s, [id]: { kind: "notfound", note: r.note || "공개된 자료에서 이 필지의 정보를 찾지 못했습니다." } }));
      }
    } catch (e) {
      setStatus((s) => ({ ...s, [id]: { kind: "error", note: "AI 웹검색 자동조회 중 오류가 발생했습니다." } }));
    }
  }
  async function lookupAll() {
    setLookupAllLoading(true);
    for (const p of parcels) { if (p.lot.trim()) await lookupOne(p.id); }
    setLookupAllLoading(false);
  }

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">物流</div>
          <div className="brand-text"><h1>물류창고 법규검토</h1><p>DUGA CNC — 사내 실무 도구 프로토타입</p></div>
        </div>
      </div>
      <div className="stepper">
        {STEPS.map((s, i) => (
          <button
            key={s.num}
            className={`step ${page === "p" + (i + 1) ? "active" : (i < 2 ? "todo clickable" : "todo")}`}
            onClick={() => { if (i < 2) setPage("p" + (i + 1)); }}
            disabled={i >= 2}
          >
            <span className="step-num">{s.num}</span><span className="step-label">{s.label}</span>
          </button>
        ))}
      </div>

      <main className="content">
        {page === "p1" && (
          <Page1
            parcels={parcels} addParcel={addParcel} removeParcel={removeParcel} updateLot={updateLot}
            status={status} debugOpen={debugOpen} setDebugOpen={setDebugOpen}
            lookupOne={lookupOne} lookupOneAI={lookupOneAI} lookupAll={lookupAll} lookupAllLoading={lookupAllLoading}
            totalArea={totalArea} validParcels={validParcels}
            onNext={() => setPage("p2")}
          />
        )}
        {page === "p2" && <Page2 parcels={validParcels} onBack={() => setPage("p1")} />}
      </main>
    </div>
  );
}

function Page1({ parcels, addParcel, removeParcel, updateLot, status, debugOpen, setDebugOpen, lookupOne, lookupOneAI, lookupAll, lookupAllLoading, totalArea, validParcels, onNext }) {
  return (
    <div>
      <div className="sheet-header">
        <h2 className="sheet-title">지번 입력</h2>
        <p className="sheet-sub">지번은 여러 개 추가할 수 있습니다. 한 건의 사업이 여러 필지로 이루어진 경우 모두 추가해서 합쳐서 검토하세요.</p>
      </div>
      <div className="card">
        <div className="bulk-actions">
          <button className="add-btn" onClick={addParcel}>+ 지번 추가</button>
          <button className="primary-btn" onClick={lookupAll} disabled={lookupAllLoading}>{lookupAllLoading ? "전체 조회 중…" : "전체 조회"}</button>
        </div>
        <table className="parcel-table">
          <thead><tr><th style={{ width: "28%" }}>지번 주소</th><th style={{ width: "18%" }}>용도지역</th><th style={{ width: "14%" }}>지목</th><th style={{ width: "16%" }}>지적면적(㎡)</th><th style={{ width: "24%" }}>동작</th></tr></thead>
          <tbody>
            {parcels.map((p) => {
              const st = status[p.id];
              return (
                <React.Fragment key={p.id}>
                  <tr className="parcel-row">
                    <td><input type="text" placeholder="예: 경기도 여주시 연라동 552-7" value={p.lot} onChange={(e) => updateLot(p.id, e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") lookupOne(p.id); }} /></td>
                    <td className="readout">{p.zoneName || "-"}</td>
                    <td className="readout">{p.jimok || "-"}</td>
                    <td className="readout">{p.area ? fmt(p.area, 0) : "-"}</td>
                    <td>
                      <div className="action-stack">
                        <button className="primary-btn small" onClick={() => lookupOne(p.id)} disabled={st && st.loading}>{st && st.loading ? "조회 중…" : "조회"}</button>
                        {parcels.length > 1 && <button className="icon-btn" onClick={() => removeParcel(p.id)}>✕ 삭제</button>}
                      </div>
                    </td>
                  </tr>
                  {st && (
                    <tr className="status-row">
                      <td colSpan={5}>
                        {st.loading && <span className="status-loading">🔄 조회 중…</span>}
                        {!st.loading && st.kind === "error" && <span className="status-error">⚠ {st.note} <button className="link-btn" onClick={() => lookupOneAI(p.id)}>AI 웹검색으로 재조회</button></span>}
                        {!st.loading && st.kind === "notfound" && <span className="status-notfound">ⓘ {st.note} <button className="link-btn" onClick={() => lookupOneAI(p.id)}>AI 웹검색으로 재조회</button></span>}
                        {!st.loading && !st.kind && <span className="status-ok">{st.source === "vworld" ? "브이월드 API 조회 결과" : "AI 웹검색 조회 결과"}{st.sourceUrl && (<> · <a href={st.sourceUrl} target="_blank" rel="noreferrer">참고 링크</a></>)}</span>}
                        {st.debug && !st.loading && (
                          <>
                            {" "}<button className="link-btn" onClick={() => setDebugOpen((d) => ({ ...d, [p.id]: !d[p.id] }))}>{debugOpen[p.id] ? "원본 응답 닫기" : "원본 응답 보기"}</button>
                            {debugOpen[p.id] && <pre className="debug-pre">{JSON.stringify(st.debug, null, 2)}</pre>}
                          </>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        <div className="total-strip">
          <span>입력된 지번 <b>{parcels.length}</b>개</span><span>조회 완료 <b>{validParcels.length}</b>개</span><span>합계 대지면적 <b>{fmt(totalArea, 0)} ㎡</b></span>
        </div>
        <p className="source-note">실제 적용 전 <a href="https://www.eum.go.kr/web/am/amMain.jsp" target="_blank" rel="noreferrer">토지이음</a>에서 재확인이 필요합니다.</p>
      </div>
      <button className="next-btn active" onClick={onNext} disabled={validParcels.length === 0}>다음: 지번별 법규 검토 →</button>
    </div>
  );
}

function Page2({ parcels, onBack }) {
  const [priceStatus, setPriceStatus] = useState({});
  const [ordinStatus, setOrdinStatus] = useState({});
  const [ordinDebugOpen, setOrdinDebugOpen] = useState({});

  async function lookupPrice(p) {
    if (!p.pnu) return;
    setPriceStatus((s) => ({ ...s, [p.id]: { loading: true } }));
    try {
      const r = await vworldLandPrice(p.pnu);
      const item = r && r.indvdLandPrices && r.indvdLandPrices.field && r.indvdLandPrices.field[0];
      const price = item ? (item.pblntfPclnd || item.pubLandPrice) : null;
      const year = item ? (item.stdrYear || item.stdrYr) : null;
      if (price) setPriceStatus((s) => ({ ...s, [p.id]: { price, year, raw: r } }));
      else setPriceStatus((s) => ({ ...s, [p.id]: { kind: "notfound", note: "공시지가 데이터를 찾지 못했습니다.", raw: r } }));
    } catch (e) {
      setPriceStatus((s) => ({ ...s, [p.id]: { kind: "error", note: "공시지가 API 호출 중 오류가 발생했습니다.", raw: { error: String(e) } } }));
    }
  }

  async function lookupOrdinance(p) {
    const city = extractCityName(p.lot);
    if (!city) { setOrdinStatus((s) => ({ ...s, [p.id]: { kind: "error", note: "지번 주소에서 시·군을 인식하지 못했습니다." } })); return; }
    setOrdinStatus((s) => ({ ...s, [p.id]: { loading: true, city } }));
    try {
      const r = await fetchOrdinanceKeywordHits(city, ["창고", "건폐율", "용적률", "주차"]);
      setOrdinStatus((s) => ({ ...s, [p.id]: { city, ...r } }));
    } catch (e) {
      setOrdinStatus((s) => ({ ...s, [p.id]: { city, kind: "error", note: "조례 API 호출 중 오류가 발생했습니다 (CORS 또는 네트워크 문제일 수 있습니다).", debug: { error: String(e) } } }));
    }
  }

  return (
    <div>
      <div className="sheet-header">
        <h2 className="sheet-title">지번별 법규 검토</h2>
        <p className="sheet-sub">01에서 입력한 필지를 기준으로 검토합니다. 국가 법령 기준은 자동으로 표시되고, 지자체 조례·공시지가는 필지별로 조회 버튼을 눌러 확인합니다.</p>
      </div>

      <div className="card">
        <h3>국가 법령 기준 (전국 공통)</h3>
        <div className="law-item"><b>층수·높이제한</b><p>일조권 사선제한(정북방향 높이제한)은 전용주거·일반주거지역에만 적용됩니다. 계획관리지역·공업지역 등에는 해당 없음이 원칙입니다. 가로구역별 높이제한은 지자체가 별도 지정한 경우에만 있어 개별 확인이 필요합니다.</p><p className="source-note">출처: 건축법 제60조·제61조</p></div>
        <div className="law-item"><b>건축선 규정</b><p>원칙적으로 대지와 도로의 경계선이 건축선입니다. 접한 도로 폭이 4m 미만이면 도로 중심선에서 소요너비의 1/2만큼 후퇴한 선이 건축선이 됩니다.</p><p className="source-note">출처: 건축법 제46조, 시행령 제31조</p></div>
        <div className="law-item"><b>도로조건 규제사항</b><p>대지는 원칙적으로 2m 이상 도로에 접해야 합니다. 연면적 합계 2,000㎡ 이상인 건축물(창고시설 포함, 공장은 3,000㎡ 기준 별도 적용)은 너비 6m 이상 도로에 4m 이상 접해야 합니다.</p><p className="source-note">출처: 건축법 제44조, 시행령 제28조</p></div>
        <div className="law-item review"><b>창고시설 행위가능여부 <span className="badge review">조례 확인 필요</span></b><p>계획관리지역에서 일반 창고시설은 국가 시행령상 원칙적으로 "건축할 수 없는 건축물"에 해당하며, 지자체 도시계획조례가 이를 허용 목록에서 별도로 제외해야 건축이 가능합니다. 즉 이 항목은 국가 법령만으로는 판단할 수 없고, 반드시 해당 지자체 조례를 확인해야 합니다.</p><p className="source-note">출처: 국토의 계획 및 이용에 관한 법률 시행령 제71조제1항제19호·별표20</p></div>
      </div>

      {parcels.map((p) => {
        const pr = priceStatus[p.id];
        const or_ = ordinStatus[p.id];
        return (
          <div className="card" key={p.id}>
            <h3>{p.lot || "(지번 미입력)"} <span className="badge review">{p.zoneName || "용도지역 미확인"}</span></h3>

            <div className="subsection">
              <div className="subsection-head">
                <span>최근 공시지가</span>
                <button className="primary-btn small" onClick={() => lookupPrice(p)} disabled={!p.pnu || (pr && pr.loading)}>{pr && pr.loading ? "조회 중…" : "공시지가 조회"}</button>
              </div>
              {!p.pnu && <p className="status-notfound">ⓘ 01에서 이 필지의 자동조회를 먼저 완료해야 PNU가 있어 조회할 수 있습니다.</p>}
              {pr && pr.price && <p className="result-inline">{fmt(pr.price, 0)} 원/㎡ {pr.year && `(기준연도 ${pr.year})`}</p>}
              {pr && pr.kind === "notfound" && <p className="status-notfound">ⓘ {pr.note}</p>}
              {pr && pr.kind === "error" && <p className="status-error">⚠ {pr.note}</p>}
            </div>

            <div className="subsection">
              <div className="subsection-head">
                <span>건폐율·용적률·창고시설 관련 조례</span>
                <button className="primary-btn small" onClick={() => lookupOrdinance(p)} disabled={or_ && or_.loading}>{or_ && or_.loading ? "조회 중…" : "조례 조회"}</button>
              </div>
              {or_ && or_.loading && <p className="status-loading">🔄 {or_.city} 도시계획 조례를 검색하는 중…</p>}
              {or_ && !or_.loading && or_.kind === "error" && <p className="status-error">⚠ {or_.note}</p>}
              {or_ && !or_.loading && or_.found === false && <p className="status-notfound">ⓘ {or_.reason}</p>}
              {or_ && !or_.loading && or_.found && or_.hits && or_.hits.length === 0 && (
                <p className="status-notfound">ⓘ "{or_.ordinName}"에서 창고·건폐율·용적률·주차 관련 조문을 찾지 못했습니다. 별표(첨부 서식)에 있을 가능성이 있어 원본 조례를 직접 확인해주세요.</p>
              )}
              {or_ && !or_.loading && or_.found && or_.hits && or_.hits.length > 0 && (
                <div>
                  <p className="source-note">출처: {or_.ordinName}</p>
                  {or_.hits.map((h, i) => (
                    <div className="ordin-hit" key={i}>
                      <b>{h.title}</b>
                      <p>{h.text}</p>
                    </div>
                  ))}
                </div>
              )}
              {or_ && or_.debug && !or_.loading && (
                <>
                  <button className="link-btn" onClick={() => setOrdinDebugOpen((d) => ({ ...d, [p.id]: !d[p.id] }))}>{ordinDebugOpen[p.id] ? "원본 응답 닫기" : "원본 응답 보기"}</button>
                  {ordinDebugOpen[p.id] && <pre className="debug-pre">{JSON.stringify(or_.debug, null, 2)}</pre>}
                </>
              )}
            </div>
          </div>
        );
      })}

      <button className="add-btn" onClick={onBack}>← 01 지번 입력으로 돌아가기</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<style>
  :root {
    --ink:#16263A; --ink-soft:#51606D; --paper:#EFF2F1; --line:rgba(22,38,58,.14);
    --accent:#1F6F5C; --accent-soft:rgba(31,111,92,.10);
    --review:#A23A2E; --review-bg:rgba(162,58,46,.10);
    --proposal:#9C6414; --proposal-bg:rgba(156,100,20,.12);
    --mockup:#6B6F76;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;
    font-size:15px; line-height:1.6; }
  .topbar { padding:18px 28px; border-bottom:1px solid var(--line); background:#fff; }
  .brand { display:flex; align-items:center; gap:12px; max-width:860px; margin:0 auto; }
  .brand-mark { width:34px; height:34px; border:1.5px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; }
  .brand-text h1 { margin:0; font-size:16px; font-weight:700; }
  .brand-text p { margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .stepper { display:flex; justify-content:center; gap:6px; padding:18px 12px; max-width:860px; margin:0 auto; flex-wrap:wrap; }
  .step { display:flex; align-items:center; gap:6px; font-size:12.5px; padding:6px 10px; border-radius:20px; border:none; background:transparent; font-family:inherit; }
  .step.active { background:var(--ink); color:#fff; font-weight:600; }
  .step.todo { color:var(--ink-soft); }
  .step.clickable { cursor:pointer; }
  .step.clickable:hover { background:var(--accent-soft); }
  .step:disabled { cursor:not-allowed; opacity:.6; }
  .step-num { font-size:10.5px; opacity:.8; }
  .content { max-width:860px; margin:0 auto; padding:8px 20px 60px; }
  .sheet-header { margin-bottom:18px; text-align:center; }
  .sheet-title { font-size:22px; font-weight:700; margin:0 0 6px; }
  .sheet-sub { font-size:14px; color:var(--ink-soft); margin:0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:22px; margin-bottom:16px; }
  .card h3 { display:flex; align-items:center; gap:8px; margin:0 0 14px; font-size:16px; }
  .bulk-actions { display:flex; gap:10px; margin-bottom:14px; }
  .add-btn { border:1px dashed var(--line); background:transparent; color:var(--ink-soft); border-radius:6px; padding:9px 14px; cursor:pointer; font-size:13.5px; }
  .add-btn:hover { border-color:var(--accent); color:var(--accent); }
  .primary-btn { background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:6px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .primary-btn:hover { opacity:.9; }
  .primary-btn:disabled { opacity:.55; cursor:not-allowed; }
  .primary-btn.small { padding:6px 10px; font-size:12px; font-weight:500; }
  .parcel-table { width:100%; border-collapse:collapse; }
  .parcel-table th { text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:0 8px 8px; }
  .parcel-row td { padding:6px 8px; vertical-align:middle; }
  .parcel-row input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:5px; font-size:14px; font-family:inherit; }
  .readout { font-size:13.5px; color:var(--ink); }
  .action-stack { display:flex; gap:6px; align-items:center; }
  .icon-btn { border:1px solid var(--line); background:#fff; border-radius:5px; padding:6px 8px; cursor:pointer; color:var(--review); font-size:12px; white-space:nowrap; }
  .status-row td { padding:2px 8px 12px; font-size:12px; }
  .status-loading { color:var(--ink-soft); }
  .status-error { color:var(--review); }
  .status-notfound { color:var(--proposal); }
  .status-ok { color:var(--ink-soft); }
  .status-ok a { color:var(--accent); }
  .link-btn { font-size:11.5px; color:var(--accent); background:none; border:1px solid var(--line); border-radius:4px; padding:3px 8px; cursor:pointer; margin-left:4px; }
  .debug-pre { margin-top:6px; background:#0F1B29; color:#B9D6C9; padding:12px; border-radius:5px; font-size:11px; max-height:280px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .total-strip { display:flex; gap:24px; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--line); margin-top:16px; padding-top:14px; flex-wrap:wrap; }
  .total-strip b { color:var(--ink); font-size:15px; }
  .source-note { font-size:12px; color:var(--ink-soft); margin-top:10px; text-align:center; }
  .source-note a { color:var(--accent); }
  .next-btn { display:block; width:100%; margin-top:16px; padding:12px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
  .next-btn:disabled { background:transparent; color:var(--mockup); border:1px dashed var(--line); cursor:not-allowed; }
  .law-item { border-bottom:1px solid var(--line); padding:14px 0; }
  .law-item:last-child { border-bottom:none; }
  .law-item b { font-size:14px; display:flex; align-items:center; gap:8px; }
  .law-item p { font-size:13.5px; color:var(--ink-soft); margin:6px 0 0; }
  .law-item .source-note { text-align:left; margin-top:4px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:3px; }
  .badge.review { background:var(--review-bg); color:var(--review); }
  .subsection { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .subsection:first-child { border-top:none; padding-top:0; margin-top:0; }
  .subsection-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13.5px; font-weight:600; }
  .result-inline { font-size:17px; font-weight:700; margin:4px 0; }
  .ordin-hit { background:#F6F7F6; border-radius:5px; padding:10px 12px; margin-top:8px; font-size:13px; }
  .ordin-hit b { display:block; margin-bottom:4px; }
  .ordin-hit p { margin:0; color:var(--ink-soft); white-space:pre-wrap; }
  @media (max-width:640px) {
    .parcel-table, .parcel-table thead, .parcel-table tbody, .parcel-table th, .parcel-table td, .parcel-table tr { display:block; }
    .parcel-table thead { display:none; }
    .parcel-row { border:1px solid var(--line); border-radius:6px; margin-bottom:10px; padding:8px; }
  }
</style>
</body>
</html>
